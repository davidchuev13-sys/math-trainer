<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр: Представление чисел в виде степени</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(22, 27, 34, 0.95);
            border: 2px solid #30363d;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 210, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 26px;
            color: #00d2ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .subtitle {
            font-size: 16px;
            color: #8b949e;
            line-height: 1.4;
        }

        /* Таблица тренажёра */
        .trainer-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            margin-bottom: 25px;
        }

        .trainer-table th {
            font-size: 18px;
            color: #00d2ff;
            padding: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #30363d;
        }

        .trainer-table td {
            background: #0d1117;
            padding: 14px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border-top: 1px solid #30363d;
            border-bottom: 1px solid #30363d;
        }

        .trainer-table td:first-child {
            border-left: 1px solid #30363d;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .trainer-table td:last-child {
            border-right: 1px solid #30363d;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* Оформление дробей */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            font-size: 18px;
            line-height: 1.1;
        }

        .fraction .top {
            border-bottom: 2px solid #ffffff;
            padding-bottom: 2px;
        }

        .fraction .bottom {
            padding-top: 2px;
        }

        /* Блок ввода степени */
        .power-box {
            display: inline-flex;
            align-items: flex-start;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
        }

        .power-input {
            width: 55px;
            height: 42px;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            color: #00ff88;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            outline: none;
            margin-left: 4px;
            margin-top: -12px;
            transition: all 0.3s ease;
        }

        .power-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        .power-input.correct {
            border-color: #00ff88 !important;
            background: rgba(0, 255, 136, 0.15) !important;
            color: #00ff88 !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4) !important;
        }

        .power-input.wrong {
            border-color: #ff3366 !important;
            background: rgba(255, 51, 102, 0.15) !important;
            color: #ff3366 !important;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4) !important;
        }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .check-btn {
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            border: none;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            padding: 15px 45px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .check-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 212, 255, 0.5);
        }

        .status-msg {
            font-size: 20px;
            font-weight: 700;
            min-height: 30px;
            text-align: center;
        }

        .status-msg.success { color: #00ff88; }
        .status-msg.error { color: #ff3366; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="title">Математический Тренажёр</h1>
            <p class="subtitle">Запишите каждое число в виде степени указанного основания</p>
        </div>

        <table class="trainer-table">
            <thead>
                <tr>
                    <th style="width: 33%;">Число</th>
                    <th style="width: 33%;">Основание</th>
                    <th style="width: 34%;">Ответ</th>
                </tr>
            </thead>
            <tbody>
                <!-- 16 = 2^4 -->
                <tr>
                    <td>16</td>
                    <td>2</td>
                    <td>
                        <div class="power-box">
                            2<input type="text" class="power-input" data-answer="4" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
                <!-- 27 = 3^3 -->
                <tr>
                    <td>27</td>
                    <td>3</td>
                    <td>
                        <div class="power-box">
                            3<input type="text" class="power-input" data-answer="3" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
                <!-- 25 = 5^2 -->
                <tr>
                    <td>25</td>
                    <td>5</td>
                    <td>
                        <div class="power-box">
                            5<input type="text" class="power-input" data-answer="2" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
                <!-- 1/25 = 5^-2 -->
                <tr>
                    <td>
                        <div class="fraction">
                            <span class="top">1</span>
                            <span class="bottom">25</span>
                        </div>
                    </td>
                    <td>5</td>
                    <td>
                        <div class="power-box">
                            5<input type="text" class="power-input" data-answer="-2" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
                <!-- 1/3 = 3^-1 -->
                <tr>
                    <td>
                        <div class="fraction">
                            <span class="top">1</span>
                            <span class="bottom">3</span>
                        </div>
                    </td>
                    <td>3</td>
                    <td>
                        <div class="power-box">
                            3<input type="text" class="power-input" data-answer="-1" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
                <!-- 1/16 = 2^-4 -->
                <tr>
                    <td>
                        <div class="fraction">
                            <span class="top">1</span>
                            <span class="bottom">16</span>
                        </div>
                    </td>
                    <td>2</td>
                    <td>
                        <div class="power-box">
                            2<input type="text" class="power-input" data-answer="-4" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
                <!-- 81 = 3^4 -->
                <tr>
                    <td>81</td>
                    <td>3</td>
                    <td>
                        <div class="power-box">
                            3<input type="text" class="power-input" data-answer="4" placeholder="x" inputmode="numeric">
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="action-area">
            <button class="check-btn" id="checkBtn">Проверить ответы</button>
            <div class="status-msg" id="statusMsg"></div>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('.power-input');
        const checkBtn = document.getElementById('checkBtn');
        const statusMsg = document.getElementById('statusMsg');

        inputs.forEach((input, idx) => {
            input.addEventListener('input', () => {
                input.classList.remove('correct', 'wrong');
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (idx < inputs.length - 1) {
                        inputs[idx + 1].focus();
                    } else {
                        checkAll();
                    }
                }
            });
        });

        function checkAll() {
            let correctCount = 0;
            let total = inputs.length;

            inputs.forEach(input => {
                const userVal = input.value.trim();
                const targetVal = input.getAttribute('data-answer');

                if (userVal === targetVal) {
                    input.classList.remove('wrong');
                    input.classList.add('correct');
                    correctCount++;
                } else {
                    input.classList.remove('correct');
                    input.classList.add('wrong');
                }
            });

            if (correctCount === total) {
                statusMsg.textContent = "Отлично! Все показатели степеней указаны верно! 🎉";
                statusMsg.className = "status-msg success";
            } else {
                statusMsg.textContent = `Решено верно: ${correctCount} из ${total}. Проверьте ошибки!`;
                statusMsg.className = "status-msg error";
            }
        }

        checkBtn.addEventListener('click', checkAll);
    </script>
</body>
</html>
